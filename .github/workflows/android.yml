name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # Job-weit, damit die Bedingung unten greift. Leere Secrets = kein Release-Build.
    env:
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Release-APK bauen
        if: env.KEYSTORE_FILE != ''
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: chatt-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Release-APK hochladen
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: chatt-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
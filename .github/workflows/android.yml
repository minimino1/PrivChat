name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # Job-weit, damit die Bedingung unten greift. Leere Secrets = kein Release-Build.
    env:
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # KEIN android-actions/setup-android: die Action versucht das Legacy-Paket
      # "tools" zu installieren, das Google aus dem Repository entfernt hat
      # ("Failed to find package 'tools'"). Der Runner hat das SDK schon dabei –
      # deshalb installieren wir hier direkt die benoetigten Pakete.
      - name: Android SDK einrichten
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nicht gefunden – Runner-Image pruefen"
            exit 1
          fi
          echo "Verwendetes sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          "$SDKMANAGER" --list_installed

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Release-APK bauen
        if: env.KEYSTORE_FILE != ''
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: chatt-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Release-APK hochladen
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: chatt-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30